services:
  postgres:
    image: postgres:16-alpine
    container_name: game_services_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_services
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_services"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: game_services_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/game_services
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-default_secret_key_change_in_production_32_chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      WORKER_SECRET: ${WORKER_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
